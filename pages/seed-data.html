<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LetControl — Seed de Dados</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: #1a1d27;
            border: 1px solid #2d3148;
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 660px;
            margin-top: 1rem;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: .3rem;
        }

        p.sub {
            font-size: .83rem;
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        label {
            font-size: .8rem;
            font-weight: 600;
            color: #94a3b8;
            display: block;
            margin-bottom: .3rem;
        }

        input {
            width: 100%;
            padding: .65rem .9rem;
            background: #0f1117;
            border: 1px solid #2d3148;
            border-radius: 10px;
            color: #e2e8f0;
            font-size: .88rem;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color .2s;
        }

        input:focus {
            border-color: #1aaef0;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        button {
            width: 100%;
            padding: .8rem;
            border: none;
            border-radius: 10px;
            font-size: .9rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .5rem;
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #1aaef0;
            color: #fff;
        }

        .btn-success {
            background: #10b981;
            color: #fff;
        }

        .btn-danger {
            background: #ef4444;
            color: #fff;
            margin-top: .6rem;
        }

        .btn-ghost {
            background: #1e2235;
            color: #94a3b8;
            margin-top: .6rem;
            border: 1px solid #2d3148;
        }

        #log {
            background: #0a0c14;
            border: 1px solid #1e2235;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1.2rem;
            font-family: 'Courier New', monospace;
            font-size: .76rem;
            max-height: 380px;
            overflow-y: auto;
            display: none;
            line-height: 1.75;
        }

        .log-ok {
            color: #10b981;
        }

        .log-err {
            color: #ef4444;
            font-weight: 700;
        }

        .log-info {
            color: #1aaef0;
        }

        .log-warn {
            color: #f59e0b;
        }

        .log-dim {
            color: #3d4f6b;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, .3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .badge {
            display: inline-block;
            font-size: .7rem;
            font-weight: 700;
            padding: .15rem .55rem;
            border-radius: 100px;
            background: rgba(26, 174, 240, .12);
            color: #1aaef0;
            border: 1px solid rgba(26, 174, 240, .25);
            margin-left: .4rem;
            vertical-align: middle;
        }

        hr {
            border: none;
            border-top: 1px solid #2d3148;
            margin: 1.2rem 0;
        }

        .status-bar {
            font-size: .82rem;
            padding: .7rem 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
            align-items: center;
            gap: .5rem;
            font-weight: 600;
        }

        .auth-ok {
            display: flex !important;
            background: rgba(16, 185, 129, .1);
            border: 1px solid rgba(16, 185, 129, .25);
            color: #10b981;
        }

        .auth-err {
            display: flex !important;
            background: rgba(239, 68, 68, .1);
            border: 1px solid rgba(239, 68, 68, .25);
            color: #ef4444;
        }

        .progress {
            height: 6px;
            background: #1e2235;
            border-radius: 3px;
            margin-top: 1rem;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1aaef0, #10b981);
            border-radius: 3px;
            transition: width .35s;
            width: 0%;
        }

        .step-lbl {
            font-size: .75rem;
            color: #475569;
            margin-top: .4rem;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Seed de Dados <span class="badge">LetControl</span></h1>
        <p class="sub">Popula o Firebase com dados fictícios realistas para testar o dashboard.</p>

        <div id="status-bar" class="status-bar"></div>

        <div id="login-section">
            <div class="row">
                <div><label>E-mail</label><input type="email" id="s-email" placeholder="seu@email.com" /></div>
                <div><label>Senha</label><input type="password" id="s-pass" placeholder="••••••••" /></div>
            </div>
            <button class="btn-primary" id="btn-login" onclick="doLogin()">
                <div class="spinner" id="spin-login"></div>Entrar
            </button>
        </div>

        <div id="seed-section" style="display:none">
            <hr />
            <div class="row">
                <div>
                    <label>Device ID <small style="font-weight:400;color:#475569">(use o mesmo no
                            dashboard)</small></label>
                    <input type="text" id="s-deviceid" placeholder="Ex: ESP32-001" value="ESP32-DEMO-001" />
                </div>
                <div>
                    <label>Nome do dispositivo</label>
                    <input type="text" id="s-devname" value="Caixa dagua Principal" />
                </div>
            </div>
            <div class="row">
                <div><label>Meta diaria (litros)</label><input type="number" id="s-goal" value="175" min="50"
                        max="5000" /></div>
                <div><label>Dias de historico</label><input type="number" id="s-days" value="7" min="1" max="14" />
                </div>
            </div>

            <button class="btn-success" id="btn-seed" onclick="runSeed()">
                <div class="spinner" id="spin-seed"></div>Gerar dados ficticios
            </button>
            <button class="btn-ghost" onclick="testConnection()">Testar conexao com Firebase</button>
            <button class="btn-danger" onclick="clearData()">Limpar todos os dados deste device</button>

            <div class="progress" id="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="step-lbl" id="step-lbl"></div>
        </div>

        <div id="log"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDMbNYMcQXNaSVht25kCQZ2e0T9rza3F8g",
            authDomain: "letcontrol-database.firebaseapp.com",
            databaseURL: "https://letcontrol-database-default-rtdb.firebaseio.com",
            projectId: "letcontrol-database",
            storageBucket: "letcontrol-database.firebasestorage.app",
            messagingSenderId: "993338285265",
            appId: "1:993338285265:web:08cb2d6330f2433d5679f0",
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let currentUid = null;

        /* ── utils ──────────────────────────────────────────────────────── */
        function L(msg, t) {
            const el = document.getElementById('log');
            el.style.display = 'block';
            const d = document.createElement('div');
            d.className = 'log-' + (t || 'info');
            const ts = new Date().toLocaleTimeString('pt-BR');
            d.textContent = (t === 'dim') ? msg : '[' + ts + '] ' + msg;
            el.appendChild(d);
            el.scrollTop = el.scrollHeight;
        }
        function sep() { L('─'.repeat(52), 'dim'); }
        function prog(pct, lbl) {
            const b = document.getElementById('progress-bar');
            const f = document.getElementById('progress-fill');
            const l = document.getElementById('step-lbl');
            b.style.display = 'block'; f.style.width = pct + '%';
            if (lbl !== undefined) { l.style.display = lbl ? 'block' : 'none'; l.textContent = lbl; }
        }
        function status(msg, cls) {
            const el = document.getElementById('status-bar');
            el.className = 'status-bar ' + cls; el.textContent = msg;
        }
        /* Remove null/undefined — Firebase rejeita null em .set() */
        function clean(obj) {
            return JSON.parse(JSON.stringify(obj, (k, v) => (v == null ? undefined : v)));
        }
        function dayKey(ago) {
            const d = new Date();
            d.setDate(d.getDate() - ago);
            return d.toISOString().split('T')[0];
        }

        /* ── safe write com log ─────────────────────────────────────────── */
        /* SEMPRE usa .update() via multi-path (root-level) para NUNCA    */
        /* sobrescrever campos que não estão na chamada. .set() em nó pai  */
        /* apaga todos os filhos, causando perda de dados.                 */
        async function wr(path, data) {
            try {
                /* Transforma {key: val} em {'path/key': val} para garantir
                   que apenas os campos passados sejam tocados no Firebase. */
                const flat = {};
                (function flatten(prefix, obj) {
                    if (obj !== null && typeof obj === 'object' && !Array.isArray(obj)) {
                        Object.entries(obj).forEach(([k, v]) => flatten(prefix + '/' + k, v));
                    } else {
                        flat[prefix] = obj;
                    }
                })(path, data);
                await db.ref().update(flat);
                L('  ok: ' + path, 'ok');
                return true;
            } catch (e) {
                L('  FALHOU: ' + path, 'err');
                L('    ' + (e.code || '') + ' ' + e.message, 'err');
                return false;
            }
        }

        /* ── login ──────────────────────────────────────────────────────── */
        async function doLogin() {
            const email = document.getElementById('s-email').value.trim();
            const pass = document.getElementById('s-pass').value;
            if (!email || !pass) { status('Preencha e-mail e senha.', 'auth-err'); return; }
            const btn = document.getElementById('btn-login');
            const sp = document.getElementById('spin-login');
            btn.disabled = true; sp.style.display = 'block';
            try {
                const c = await auth.signInWithEmailAndPassword(email, pass);
                currentUid = c.user.uid;
                status('Logado como ' + c.user.email, 'auth-ok');
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('seed-section').style.display = 'block';
                L('UID: ' + currentUid, 'ok');
            } catch (e) {
                const m = {
                    'auth/user-not-found': 'E-mail nao encontrado.',
                    'auth/wrong-password': 'Senha incorreta.',
                    'auth/invalid-credential': 'E-mail ou senha invalidos.',
                };
                status('Erro: ' + (m[e.code] || e.message), 'auth-err');
                L(e.code + ': ' + e.message, 'err');
            } finally { btn.disabled = false; sp.style.display = 'none'; }
        }

        /* ── teste de conexao ───────────────────────────────────────────── */
        async function testConnection() {
            if (!currentUid) { L('Faca login primeiro.', 'warn'); return; }
            const did = document.getElementById('s-deviceid').value.trim() || 'TEST';
            document.getElementById('log').innerHTML = '';
            L('Testando permissoes de escrita...', 'info'); sep();
            const tests = [
                ['devices/' + did + '/name', 'Teste'],
                ['user_devices/' + currentUid + '/' + did + '/role', 'owner'],
                ['sessions/' + currentUid + '/last_active', Date.now()],
                ['goals/' + currentUid + '/daily_l', 175],
                ['aggregates/' + did + '/daily/2024-01-01/vol_l', 0],
                ['readings/' + did + '/meta/total_writes', 0],
                ['alerts/' + currentUid + '/test_chave/type', 'TEST'],
                ['preferences/' + currentUid + '/notify/push', true],
            ];
            let ok = 0, fail = 0;
            for (const [p, v] of tests) {
                if (await wr(p, v)) ok++; else fail++;
            }
            sep();
            if (fail === 0) {
                L('Todos os ' + ok + ' caminhos OK. Pode executar o seed!', 'ok');
            } else {
                L(fail + ' caminho(s) com PERMISSION_DENIED.', 'err');
                L('Va em Firebase Console > Realtime Database > Rules e use:', 'warn');
                L('{ "rules": { ".read": "auth != null", ".write": "auth != null" } }', 'warn');
            }
        }

        /* ── gerador de volumes horarios ────────────────────────────────── */
        function hourlyVols(goalL) {
            const w = [0.20, 0.10, 0.05, 0.05, 0.10, 0.50, 1.80, 2.20, 1.50, 0.80, 0.60, 0.90,
                1.40, 0.70, 0.50, 0.40, 0.50, 0.80, 1.60, 2.00, 1.50, 1.00, 0.50, 0.30];
            const sum = w.reduce((a, b) => a + b, 0);
            return w.map(x => Math.max(0, parseFloat(((x / sum) * goalL * (0.78 + Math.random() * 0.44)).toFixed(2))));
        }

        /* ── seed ───────────────────────────────────────────────────────── */
        async function runSeed() {
            if (!currentUid) { status('Faca login primeiro.', 'auth-err'); return; }
            const did = document.getElementById('s-deviceid').value.trim();
            const dname = document.getElementById('s-devname').value.trim() || 'Sensor LetControl';
            const goal = parseFloat(document.getElementById('s-goal').value) || 175;
            const days = Math.min(parseInt(document.getElementById('s-days').value) || 7, 14);
            if (!did) { L('Informe o Device ID.', 'warn'); return; }

            const btn = document.getElementById('btn-seed');
            const sp = document.getElementById('spin-seed');
            btn.disabled = true; sp.style.display = 'block';
            document.getElementById('log').innerHTML = '';
            L('Seed: device=' + did + ' | goal=' + goal + 'L | ' + days + ' dias', 'info');
            sep();

            const now = Date.now();
            const today = dayKey(0);
            let errs = 0;

            try {
                /* 1. Device */
                prog(5, 'Criando dispositivo...');
                L('[1/7] Device', 'info');
                errs += !(await wr('devices/' + did, {
                    owner_uid: '' + currentUid, name: dname, location: 'caixa_dagua',
                    firmware_version: 'v2.3.1', added_at: now
                }));
                errs += !(await wr('devices/' + did + '/status', {
                    online: true, battery_pct: 91, wifi_rssi: -57, last_seen: now
                }));
                errs += !(await wr('devices/' + did + '/config', {
                    wifi_ssid: 'MinhaRede_2G', wifi_pass: '(demo)', sample_interval_s: 5,
                    goal_daily_l: goal, leak_threshold_min: 30, leak_flow_lpm: 0.5
                }));
                errs += !(await wr('devices/' + did + '/ota', { pending: false, status: 'idle' }));

                /* 2. user_devices + session */
                prog(12, 'Configurando usuario...');
                L('[2/7] user_devices + session', 'info');
                errs += !(await wr('user_devices/' + currentUid + '/' + did, { added_at: now, role: 'owner' }));
                errs += !(await wr('sessions/' + currentUid, { active_device_id: did, last_active: now }));

                /* 3. Goals + preferences */
                prog(18, 'Salvando metas...');
                L('[3/7] Goals + preferences', 'info');
                errs += !(await wr('goals/' + currentUid, {
                    daily_l: goal, weekly_l: goal * 7, monthly_l: goal * 30, leak_min: 30, leak_lpm: 0.5
                }));
                errs += !(await wr('preferences/' + currentUid + '/notify', {
                    push: true, email: true, leak: true, goal: true
                }));

                /* 4. Aggregates diarios + horarios */
                prog(22, 'Gerando historico...');
                L('[4/7] Aggregates', 'info');
                let totalVol = 0;
                const step = 48 / days;

                for (let i = days - 1; i >= 0; i--) {
                    const key = dayKey(i);
                    const dObj = new Date(); dObj.setDate(dObj.getDate() - i);
                    const dow = dObj.getDay();
                    const mult = (dow === 0 || dow === 6) ? 1.15 + Math.random() * 0.2 : 0.75 + Math.random() * 0.4;
                    const hv = hourlyVols(goal * mult);
                    const maxH = (i === 0) ? new Date().getHours() : 23;
                    const pv = hv.map((v, h) => h <= maxH ? v : 0);
                    const vol = parseFloat(pv.reduce((a, b) => a + b, 0).toFixed(2));
                    const peak = parseFloat(Math.max(...pv.map(v => v / 60)).toFixed(3));
                    const actH = pv.filter(v => v >= 0.05).length;
                    totalVol += vol;

                    errs += !(await wr('aggregates/' + did + '/daily/' + key, {
                        vol_l: vol, peak_lpm: peak, active_hours: actH, goal_l: goal, date: key
                    }));

                    const ho = {};
                    pv.forEach((v, h) => {
                        if (v >= 0.01) ho['h' + String(h).padStart(2, '0')] = { vol_l: v, peak_lpm: parseFloat((v / 60).toFixed(3)) };
                    });
                    errs += !(await wr('aggregates/' + did + '/hourly/' + key, ho));

                    L('  ' + key + ' -> ' + vol + 'L | ' + peak + ' L/min | ' + actH + 'h', 'dim');
                    prog(22 + step * (days - i), 'Dia ' + (days - i) + '/' + days + '...');
                }
                L('  Total: ~' + totalVol.toFixed(0) + 'L', 'ok');

                /* 5. Leituras historicas (2 dias, a cada 10min) */
                prog(72, 'Leituras historicas...');
                L('[5/7] readings/history (ultimos 2 dias)', 'info');
                for (let i = Math.min(1, days - 1); i >= 0; i--) {
                    const dObj = new Date(); dObj.setDate(dObj.getDate() - i);
                    const start = new Date(dObj.getFullYear(), dObj.getMonth(), dObj.getDate()).getTime();
                    const hv = hourlyVols(goal);
                    const maxMin = (i === 0) ? new Date().getHours() * 60 + new Date().getMinutes() : 1430;
                    let cum = 0;
                    for (let m = 0; m < maxMin; m += 10) {
                        const h = Math.floor(m / 60);
                        const vol = hv[h] / 6;
                        const flow = vol / 10;
                        cum += vol;
                        const ts = start + m * 60000;
                        /* chave com prefixo string — evita ser tratado como indice de array */
                        const rkey = 't' + ts;
                        await db.ref('readings/' + did + '/history/' + rkey).set({
                            ts, f: parseFloat(flow.toFixed(3)), v: parseFloat(cum.toFixed(2)),
                            bat: 88 + Math.floor(Math.random() * 12), rssi: -(42 + Math.floor(Math.random() * 28))
                        });
                    }
                    L('  ' + dayKey(i) + ' -> ' + Math.floor(maxMin / 10) + ' leituras', 'ok');
                }

                /* 6. Live reading */
                prog(85, 'Leitura ao vivo...');
                L('[6/7] readings/live', 'info');
                const liveVol = parseFloat((goal * (new Date().getHours() / 24) * 0.9).toFixed(2));
                errs += !(await wr('readings/' + did + '/live', {
                    ts: now, flow_lpm: parseFloat((0.2 + Math.random() * 1.8).toFixed(3)),
                    vol_today_l: liveVol, valve_open: true, battery_pct: 91, wifi_rssi: -57
                }));
                errs += !(await wr('readings/' + did + '/meta', {
                    retention_days: 30, daily_reset_date: today, total_writes: days * 144
                }));

                /* 7. Alertas — SEM campos null */
                prog(92, 'Criando alertas...');
                L('[7/7] Alertas', 'info');
                const alerts = [
                    {
                        type: 'LEAK_DETECTED', severity: 'high',
                        message: 'Fluxo continuo detectado por 38 minutos sem interrupcao.',
                        created_at: now - 2 * 86400000, read: false
                    },
                    {
                        type: 'GOAL_EXCEEDED', severity: 'medium',
                        message: 'Consumo do dia ultrapassou a meta de ' + goal + 'L.',
                        created_at: now - 86400000, read: false
                    },
                    {
                        type: 'GOAL_EXCEEDED', severity: 'medium',
                        message: 'Consumo do dia ultrapassou a meta de ' + goal + 'L.',
                        created_at: now - 3 * 86400000, read: true,
                        resolved_at: now - 3 * 86400000 + 3600000
                    },
                    {
                        type: 'LOW_BATTERY', severity: 'low',
                        message: 'Bateria do sensor em 18%. Recarregue em breve.',
                        created_at: now - 5 * 86400000, read: true
                    },
                ];
                for (const a of alerts) {
                    const ref = db.ref('alerts/' + currentUid).push();
                    /* clean() remove quaisquer undefined/null antes de gravar */
                    errs += !(await wr('alerts/' + currentUid + '/' + ref.key, clean(a)));
                }

                /* resultado */
                prog(100, '');
                sep();
                if (errs === 0) {
                    L('Seed concluido sem erros!', 'ok');
                } else {
                    L('Seed concluido com ' + errs + ' erro(s). Veja logs acima.', 'warn');
                }
                L('Device ID: ' + did, 'info');
                L('No dashboard: adicione o device com o ID acima.', 'info');

            } catch (e) {
                sep();
                L('ERRO FATAL: ' + e.message, 'err');
                L('code: ' + (e.code || 'N/A'), 'err');
                console.error(e);
            } finally {
                btn.disabled = false; sp.style.display = 'none';
            }
        }

        /* ── limpar ─────────────────────────────────────────────────────── */
        async function clearData() {
            if (!currentUid) { L('Faca login primeiro.', 'warn'); return; }
            const did = document.getElementById('s-deviceid').value.trim();
            if (!did) { L('Informe o Device ID.', 'warn'); return; }
            if (!confirm('Apagar TODOS os dados de "' + did + '"? Nao pode ser desfeito.')) return;

            document.getElementById('log').innerHTML = '';
            L('Removendo "' + did + '"...', 'warn');

            for (const p of [
                'devices/' + did,
                'user_devices/' + currentUid + '/' + did,
                'aggregates/' + did,
                'readings/' + did,
            ]) {
                try { await db.ref(p).remove(); L('  ok: ' + p, 'ok'); }
                catch (e) { L('  falhou: ' + p + ' -> ' + e.message, 'err'); }
            }
            try {
                const s = await db.ref('sessions/' + currentUid + '/active_device_id').once('value');
                if (s.val() === did) {
                    await db.ref('sessions/' + currentUid + '/active_device_id').remove();
                    L('  ok: session active_device_id', 'ok');
                }
            } catch (e) { }
            L('Limpeza concluida.', 'ok');
        }
    </script>
</body>

</html>
